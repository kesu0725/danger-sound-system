<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>위험 소음 감지 시스템</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div id="container">

        <h1 id="status">
            정상 상태
        </h1>

        <p id="volume">
            현재 소리 크기: 0
        </p>

        <button id="startButton">
            시작
        </button>

        <button id="stopButton">
            중지
        </button>

        <button id="confirmButton"
            style="display:none;">
            확인
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
